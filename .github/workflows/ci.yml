name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  # ── Job 1: Build & Lint ───────────────────────────────────────────────
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/*/dist
            apps/*/dist
          retention-days: 1

  # ── Job 2: Unit Tests (parallel with Job 1) ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Run unit tests
        run: pnpm test

  # ── Job 3: Integration Tests (after Jobs 1 + 2) ─────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-lint, unit-tests]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # Dedicated, shell-reachable Postgres for the schema drift guard below.
      # The integration TESTS get their own DB from Testcontainers INSIDE the
      # test process (test/setup-db.ts), which is not reachable from a plain
      # workflow step — so the guard needs this separate, deterministic DB it
      # can point DATABASE_URL at and apply exactly the committed migrations to.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftagent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # Runs BEFORE the integration tests to fail fast: applies exactly the
      # committed migrations to a clean DB, then runs db:check against it.
      # A freshly-migrated DB always matches the journal-implied schema, so a
      # non-zero db:check here can ONLY mean a schema change was not captured as
      # a generated migration (the author edited packages/db/src/schema/*.ts but
      # forgot `pnpm db:generate`, or committed the schema edit but not the
      # resulting 000N_*.sql + snapshot). There is no benign failure mode — do
      # NOT silence a red build here; run `pnpm --filter @swiftagent/db db:generate`
      # and commit the emitted migration + snapshot instead. See
      # docs/runbooks/migrations.md.
      - name: Schema drift guard
        run: |
          pnpm --filter @swiftagent/db migrate
          pnpm --filter @swiftagent/db db:check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/swiftagent_ci

      - name: Run integration tests
        run: pnpm test:integration
        env:
          # DATABASE_URL is provisioned per-suite by test/setup-db.ts (Testcontainers),
          # which starts its own PostgreSQL and applies the Drizzle migrations.
          REDIS_URL: redis://localhost:6379

  # ── Job 4: Acceptance Tests (after Jobs 1 + 2 + 3) — REQUIRED GATE ────
  # The quickstart acceptance flow (WS-42): boots the stub-agent stack on a
  # Testcontainers Postgres (migrations via test/setup-db.ts; Redis OFF), drives
  # the documented quickstart through the PUBLIC SDK, asserts the full
  # message_started → token → tool_call_* → message_completed sequence with a
  # real tool round-trip, and — the SC-09 install proof — installs the published
  # @swiftagent/* from GitHub Packages (the `pr` snapshot on PRs, `latest` on
  # main) into a throwaway consumer. `packages: read` + NODE_AUTH_TOKEN wire that
  # registry install; Testcontainers uses the runner's Docker daemon, so no
  # `services:` block is needed. A non-zero exit BLOCKS the pipeline.
  #
  # NOTE: the root `test/` tree is excluded from typecheck/lint by convention, so
  # the acceptance suite is validated by RUNNING it here, not by build-lint.
  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build-lint, unit-tests, integration-tests]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # `registry-url` + `scope` make setup-node write the GitHub Packages auth
      # line keyed to NODE_AUTH_TOKEN, so the throwaway consumer's `npm install`
      # authenticates against npm.pkg.github.com (never a committed token).
      - name: Setup Node.js (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@swiftagent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Run acceptance tests
        run: pnpm test:acceptance
        env:
          # read:packages credential for the registry install proof. Same-repo
          # GITHUB_TOKEN carries `packages: read` (granted above) — sufficient to
          # install the @swiftagent/* snapshot/stable published by WS-38.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DATABASE_URL is provisioned per-suite by test/setup-db.ts
          # (Testcontainers). Redis is OFF by default (single-node gateway).

  # ── Job 5: Publish dry-run (pack gate) ───────────────────────────────
  # Packs @swiftagent/{sdk,react,shared} and asserts each tarball ships only
  # dist (JS + d.ts) + README.md — no src/tests/tsconfig/CJS — that workspace:*
  # deps resolved to concrete versions, and that publish metadata is correct.
  # Catches a broken files/metadata/workspace-resolution regression BEFORE a
  # release. Runs the SAME command as the documented local check so CI and
  # local never diverge: `node scripts/verify-pack.mjs`.
  publish-dryrun:
    name: Publish dry-run (pack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter @swiftagent/sdk... --filter @swiftagent/react... build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Pack & verify tarballs
        run: node scripts/verify-pack.mjs
