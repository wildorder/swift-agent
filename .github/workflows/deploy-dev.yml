name: Deploy Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: swiftagent/server
  ECS_CLUSTER: dev-swiftagent
  ECS_SERVICE: dev-swiftagent
  ENVIRONMENT: dev
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY 2>/dev/null || \
            aws ecr create-repository --repository-name $ECR_REPOSITORY --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker build -f apps/server/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: terraform apply -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}" -var="image_uri=${{ steps.build.outputs.image_uri }}"

      - name: Get deploy outputs
        id: tf-outputs
        working-directory: infra/envs/dev
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns_name=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "health_url=http://$ALB_DNS/health" >> $GITHUB_OUTPUT

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Run database migration
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' \
            --output text)

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides": [{"name": "'"$ENVIRONMENT"'-swiftagent", "command": ["node", "dist/migrate.js"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migration completed successfully"

      - name: Smoke test
        env:
          HEALTH_URL: ${{ steps.tf-outputs.outputs.health_url }}
        run: |
          echo "Testing: $HEALTH_URL"
          for i in {1..5}; do
            STATUS=$(curl -sf "$HEALTH_URL" | jq -r '.status' 2>/dev/null) && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "ok" ]; then
            echo "Smoke test failed: expected status 'ok', got '$STATUS'"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Dev deployment succeeded: dev-${{ github.sha }}"
          else
            echo "Dev deployment failed: dev-${{ github.sha }}"
          fi
