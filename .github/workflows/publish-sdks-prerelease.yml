name: Publish SDKs (PR Prerelease)

on:
  pull_request:

# Snapshot publish needs ONLY packages:write — it must NOT commit to git.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sdks-prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  prerelease:
    name: Snapshot Publish (GitHub Packages, tag=pr)
    runs-on: ubuntu-latest
    outputs:
      snapshot-version: ${{ steps.snap.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Changesets needs history to diff

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@swiftagent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter @swiftagent/sdk... --filter @swiftagent/react... build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # Stamp ephemeral snapshot versions: 0.0.0-pr-<shortsha> on all three
      # publishable packages. The `{tag}-{commit}` template yields the documented
      # `pr-<shortsha>` suffix ({commit} = `git rev-parse --short HEAD`); without
      # it Changesets would default to a datetime suffix. Requires a changeset to
      # be present on the PR (WS-42's PRs must include one); otherwise this is a
      # no-op and the publish step below publishes nothing.
      - name: Apply snapshot versions
        run: pnpm changeset version --snapshot pr --snapshot-prerelease-template '{tag}-{commit}'

      - name: Capture snapshot version
        id: snap
        run: echo "version=$(node -p "require('./packages/sdk/package.json').version")" >> "$GITHUB_OUTPUT"

      # Publish under dist-tag `pr`; --no-git-tag => no git writes. Never touches
      # `latest`. Registry resolves from publishConfig/.npmrc; the registry auth
      # line is generated by setup-node from NODE_AUTH_TOKEN (never committed).
      - name: Publish snapshot to GitHub Packages
        run: pnpm changeset publish --tag pr --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
