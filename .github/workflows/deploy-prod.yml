name: Deploy Prod

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: swiftagent/server
  ECS_CLUSTER: prod-swiftagent
  ECS_SERVICE: prod-swiftagent
  ENVIRONMENT: prod
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY 2>/dev/null || \
            aws ecr create-repository --repository-name $ECR_REPOSITORY --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -f apps/server/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: infra/envs/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/envs/prod
        run: terraform apply -auto-approve -var="image_uri=${{ steps.build.outputs.image_uri }}"

      # Derive the public endpoint from Terraform rather than hardcoding a
      # domain: with enable_dns=false the stack serves plain HTTP on the raw
      # ALB hostname (no TLS listener exists), and there is no custom domain
      # until one is registered and delegated. tls_enabled gates the wss://
      # realtime smoke below.
      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: infra/envs/prod
        run: |
          DOMAIN=$(terraform output -raw domain_name)
          if echo "$DOMAIN" | grep -q 'elb.amazonaws.com'; then
            SCHEME=http; TLS=false
          else
            SCHEME=https; TLS=true
          fi
          echo "base_url=$SCHEME://$DOMAIN" >> $GITHUB_OUTPUT
          echo "health_url=$SCHEME://$DOMAIN/health" >> $GITHUB_OUTPUT
          echo "tls_enabled=$TLS" >> $GITHUB_OUTPUT

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Create pre-migration RDS snapshot
        run: |
          SNAPSHOT_ID="swiftagent-prod-pre-deploy-$(date +%Y%m%d-%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier prod-swiftagent \
            --db-snapshot-identifier $SNAPSHOT_ID
          echo "Created RDS snapshot: $SNAPSHOT_ID"
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier $SNAPSHOT_ID
          echo "Snapshot available"

      # Runs the identical migrator as local + CI (packages/db/dist/migrate.js,
      # resolved from the image WORKDIR /app). Drift refusal is enforced by the
      # migrator's own preflight (WS-26) — a diverged schema makes it exit
      # non-zero, which the exitCode check below turns into a failed deploy. The
      # only way to bypass the preflight is MIGRATE_SKIP_DRIFT_CHECK, reserved
      # for the operator-driven reconciliation path — see docs/runbooks/migrations.md.
      - name: Run database migration
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' \
            --output text)

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides": [{"name": "'"$ENVIRONMENT"'-swiftagent", "command": ["node", "packages/db/dist/migrate.js"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migration completed successfully"

      # Idempotently provision the resources the realtime smoke test assumes
      # (same mechanism as deploy-dev): a workspace, an API key whose sha256 ==
      # SMOKE_API_KEY, and a `smoke-echo` agent on the zero-cost echo provider.
      - name: Provision realtime smoke resources
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "SMOKE_API_KEY secret is not set — cannot provision the realtime smoke test."
            exit 1
          fi

          TASK_DEF=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' \
            --output text)

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' \
            --output json)

          OVERRIDES=$(jq -nc \
            --arg name "$ENVIRONMENT-swiftagent" \
            --arg key "$SMOKE_API_KEY" \
            '{containerOverrides: [{
              name: $name,
              command: ["node", "packages/db/dist/provision-smoke.js"],
              environment: [
                {name: "SMOKE_API_KEY", value: $key},
                {name: "SMOKE_AGENT_NAME", value: "smoke-echo"}
              ]
            }]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Waiting for smoke provisioning task to complete..."
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Smoke provisioning failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Smoke provisioning completed successfully"

      - name: Smoke test
        env:
          HEALTH_URL: ${{ steps.tf-outputs.outputs.health_url }}
        run: |
          echo "Testing: $HEALTH_URL"
          for i in {1..5}; do
            STATUS=$(curl -sf "$HEALTH_URL" | jq -r '.status' 2>/dev/null) && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "ok" ]; then
            echo "Smoke test failed: expected status 'ok', got '$STATUS'"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Realtime smoke test
        # Proves the deployed realtime path end-to-end: POST /v1/sessions (API-key)
        # → WS connect to the returned websocketUrl (/v1/stream?token=) → send_message
        # → assert message_started → token(s) → message_completed. A failure here
        # BLOCKS the deploy (and the release tag below). See WS-35 / docs quickstart (WS-34).
        #
        # GATED ON TLS: with enable_dns=false the server hands out a
        # wss:// websocketUrl pointing at the raw ALB, which has no TLS
        # listener — the WS connect cannot succeed until a domain is
        # registered, delegated, and enable_dns applied. The gate keeps the
        # deploy honest instead of red while the domain is pending; the
        # loud log line below makes the skip visible.
        if: steps.tf-outputs.outputs.tls_enabled == 'true'
        env:
          SMOKE_BASE_URL: ${{ steps.tf-outputs.outputs.base_url }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_AGENT_NAME: smoke-echo
        run: pnpm smoke:realtime

      - name: Realtime smoke skipped (no TLS yet)
        if: steps.tf-outputs.outputs.tls_enabled != 'true'
        run: echo "SKIPPED realtime smoke — enable_dns=false, no TLS listener; register + delegate the domain, enable DNS, and this step runs for real."

      - name: Tag image with release version
        if: github.event_name == 'release'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          VERSION=${{ github.event.release.tag_name }}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:prod-${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Prod deployment succeeded: prod-${{ github.sha }}"
          else
            echo "Prod deployment failed: prod-${{ github.sha }}"
          fi
