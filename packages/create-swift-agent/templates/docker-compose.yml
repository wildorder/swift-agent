# Local development stack for this project — generated by create-swift-agent.
#
# Mirrors the Swift Agent repository's WS-43 compose wiring: a SINGLE server
# service publishing port 3000 (REST + WebSocket on one listener), Postgres,
# Redis, a one-shot bootstrap that mints a dev API key into ./.swiftagent-local/
# on first run, and this project's own agent backend.
#
# SINGLE-INSTANCE BY CONSTRUCTION (SC-12): exactly one server service, no
# `deploy:`, no `replicas`, no `scale`. This file is a LOCAL development
# artifact — never a deployment target.
services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: swiftagent
      POSTGRES_PASSWORD: swiftagent_dev
      POSTGRES_DB: swiftagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swiftagent']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Swift Agent server (the ONLY server service) ────────────────────
  # Set SWIFT_AGENT_SERVER_IMAGE in .env to point at a locally built image
  # (docker build -f apps/server/Dockerfile . from a swift-agent checkout)
  # until an official image is published.
  swift-agent:
    image: ${SWIFT_AGENT_SERVER_IMAGE:-ghcr.io/wildorder/swift-agent:latest}
    ports:
      - '3000:3000' # REST + WebSocket (unified listener)
      - '4000:4000' # this project's /api/session route (backend shares this network namespace)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://swiftagent:swiftagent_dev@postgres:5432/swiftagent
      REDIS_URL: redis://redis:6379
      API_PORT: '3000'
      # Dev-only JWT secret for client token signing.
      CLIENT_JWT_SECRET: dev-jwt-secret-change-in-production
      # Handed to browser clients verbatim: canonical /v1/stream path on the
      # single published port.
      PUBLIC_WEBSOCKET_URL: ws://localhost:3000/v1/stream
      AUTO_MIGRATE: 'true'
      # Zero-cost deterministic tool-calling fixture model, so this stack works
      # with no provider key. The server refuses this flag in cloud DEPLOY_ENVs.
      LOCAL_FIXTURE_PROVIDER: 'true'
      # Allow the plain-http loopback tool-runner target below.
      RUNNER_REQUIRE_HTTPS: 'false'
      # DEV ONLY — local compose only. This EdDSA private JWK signs short-lived
      # scoped tokens for the backend's tool runner on this compose network
      # (same committed-dev-key precedent as CLIENT_JWT_SECRET above).
      RUNNER_TOKEN_PRIVATE_KEY: '{"crv":"Ed25519","d":"Q0ihC1z_6613OSzAxI13X588cxuec8mUUbJMi-SKmmo","x":"AtVR_YILLC99-cB21IYSh14yrVE78bz9KwnrwAw1Vv4","kty":"OKP"}'
      NODE_ENV: development
    # The server's SSRF guard permits only loopback tool-runner targets in dev,
    # so the backend service shares THIS container's network namespace (see its
    # network_mode) and `backend` is pinned to loopback here — the registered
    # toolRunnerUrl http://backend:8787 resolves to a permitted address.
    extra_hosts:
      - 'backend:127.0.0.1'
      - 'host.docker.internal:host-gateway'
    env_file:
      - path: .env
        required: false
    # IPv4 literal: the server listens on 0.0.0.0 (IPv4) while Alpine wget
    # resolves `localhost` to ::1 first.
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ── One-shot local bootstrap ────────────────────────────────────────
  # Idempotently provisions a workspace + dev API key after AUTO_MIGRATE has
  # created the schema. The raw key + runner workspace id land in
  # ./.swiftagent-local (gitignored) via the bind mount.
  bootstrap:
    image: ${SWIFT_AGENT_SERVER_IMAGE:-ghcr.io/wildorder/swift-agent:latest}
    command: ['node', 'packages/db/dist/provision-local.js']
    # Root, deliberately: on Linux the daemon creates the ./.swiftagent-local
    # bind mount root-owned, so the image's non-root user cannot write it.
    # The provisioner hands the written files back to the mount's owner (or
    # leaves them world-readable when the owner is root). Dev-only, one-shot.
    user: '0:0'
    depends_on:
      swift-agent:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://swiftagent:swiftagent_dev@postgres:5432/swiftagent
    volumes:
      - ./.swiftagent-local:/bootstrap-out

  # ── This project's agent backend ────────────────────────────────────
  # Runs backend/ (npm install + tsx watch) INSIDE the server's network
  # namespace so the SDK tool runner is loopback-reachable by the server
  # (paired with the `backend:127.0.0.1` extra_hosts entry above).
  backend:
    image: node:22-alpine
    working_dir: /app
    # The named volume below overlays /app/node_modules, so the container keeps
    # its OWN Linux install and never shares binaries with a host-side install
    # (Windows/macOS hosts would otherwise break the Linux container).
    # `npm ci` when a lockfile exists (deterministic); first run falls back to
    # `npm install`.
    command:
      [
        'sh',
        '-c',
        'if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi && npm run dev',
      ]
    network_mode: 'service:swift-agent'
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      # Advanced: point npm at a different registry (e.g. a local test registry).
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
      # Same netns as the server — the control plane is loopback.
      SWIFT_AGENT_BASE_URL: http://127.0.0.1:3000
      # Bootstrap outputs (bind mount below).
      SWIFT_AGENT_API_KEY_FILE: /bootstrap-out/dev-api-key
      RUNNER_ENV_FILE: /bootstrap-out/runner-env.json
      # DEV ONLY — public verification half of the dev keypair whose private
      # JWK is set on the swift-agent service above.
      RUNNER_TOKEN_PUBLIC_KEY: '{"crv":"Ed25519","x":"AtVR_YILLC99-cB21IYSh14yrVE78bz9KwnrwAw1Vv4","kty":"OKP"}'
      # Registered toolRunnerUrl + token audience (must match).
      TOOL_RUNNER_PUBLIC_URL: http://backend:8787
      RUNNER_AUDIENCE: http://backend:8787
      RUNNER_PORT: '8787'
      PORT: '4000'
      # Default: the zero-key deterministic fixture model. Set
      # COMPOSE_AGENT_MODEL in .env to use your real provider model.
      SWIFT_AGENT_MODEL: ${COMPOSE_AGENT_MODEL:-fixture/tool-call}
    volumes:
      - ./backend:/app
      # Container-local node_modules (see the command note above).
      - backend_node_modules:/app/node_modules
      - ./.swiftagent-local:/bootstrap-out:ro

volumes:
  pgdata:
  backend_node_modules:
